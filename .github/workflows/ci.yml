name: CI

on:
  push:
  pull_request:

jobs:
  e2e:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ubuntu: ["24.04", "26.04"]
    container: ubuntu:${{ matrix.ubuntu }}
    steps:
      - uses: actions/checkout@v7
      - run: REPO="$GITHUB_WORKSPACE" bash tests/ci.sh
